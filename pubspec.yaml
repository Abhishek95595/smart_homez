name: smart_homez
description: "Smart_homz - IoT-based smart building/society management app."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: 6.1.5+1

  # Local storage
  shared_preferences: 2.5.5
  hive: 2.2.3
  hive_flutter: 1.1.0
  flutter_secure_storage: ^10.3.1

  # Networking
  http: ^1.6.0
  dio: ^5.11.0
  flutter_client_sse: 2.0.3

  # Charts
  fl_chart: ^1.2.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.5.1
  json_annotation: ^4.12.0
  image: ^4.9.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  url_launcher: ^6.3.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  mockito: ^5.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/